<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Simulation de paiement — NexaPay</title>
<style>
:root{--ink:#14233a;--mut:#5d6b80;--brand:#1f3a5f;--bg:#f2f5f9;--line:#d8e0ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.sim{background:#fff3cd;color:#664d03;font-size:13px;font-weight:600;padding:10px 14px;text-align:center}
main{max-width:420px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
h1{margin:6px 0}.mut{color:var(--mut)}.note{font-size:12px;letter-spacing:.06em;color:var(--mut)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px 14px;width:100%;margin-top:8px}
button.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset;font-weight:600}
button.go{background:var(--brand);color:#fff;border-color:var(--brand)}button:disabled{opacity:.5}
.badge{display:inline-block;padding:6px 12px;border-radius:99px;background:#e7edf5;font-weight:600}
</style></head><body>
<div class="sim">SIMULATION · aucun argent réel ne sera débité. Ne saisissez jamais de numéro de carte.</div>
<main id="m"><p class="mut">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://dolcwgdhmbnnulxfvxkd.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvbGN3Z2RobWJubnVseGZ2eGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzg1NDgsImV4cCI6MjExMDk1NDU0OH0.qIvDMDd5E0PWH6PMx6nXOJp6hzbx-4T_fnmrMrT917M");
const code=new URLSearchParams(location.search).get("c")||"",m=document.getElementById("m"),METHODS=["DZ Mob Pay","Baridi Pay","CIB / Edahabia"];let sel=0;
const fmt=n=>new Intl.NumberFormat("fr-DZ").format(n)+" DZD";
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
async function load(){
  if(!/^[0-9a-f]{32}$/.test(code))return m.replaceChildren(h("p","mut","Lien invalide."));
  const {data,error}=await sb.rpc("get_payment",{p_code:code});
  if(error||!data||!data.length)return m.replaceChildren(h("p","mut","Demande introuvable."));
  draw(data[0]);
}
function draw(r){
  const c=h("div","card");
  c.append(h("div","note","PAIEMENT · SIMULATION"),h("h1","",fmt(r.amount)),h("p","mut","À payer à "+r.merchant_name+(r.merchant_city?", "+r.merchant_city:"")),h("p","mut",r.ref_no+" · "+r.description));
  if(r.status!=="pending"||r.expired){c.append(h("span","badge",r.status==="paid"?"Payé (simulé)":r.status==="failed"?"Refusé (simulé)":"Demande expirée"));return m.replaceChildren(c)}
  const bs=METHODS.map((n,i)=>{const b=h("button",i===sel?"on":"",n);b.onclick=()=>{sel=i;bs.forEach((x,j)=>x.className=j===i?"on":"")};return b});
  const ok=h("button","go","Autoriser (simulation)"),no=h("button","","Refuser (simulation)"),msg=h("p","mut","");
  const act=async r=>{ok.disabled=no.disabled=true;const {data,error}=await sb.rpc("simulate_payment",{p_code:code,p_result:r,p_method:METHODS[sel]});
    if(error||data==="unavailable"){msg.textContent="Cette demande n’est plus disponible.";}load()};
  ok.onclick=()=>act("paid");no.onclick=()=>act("failed");
  c.append(...bs,ok,no,msg);m.replaceChildren(c);
}
load();
</script></body></html>
