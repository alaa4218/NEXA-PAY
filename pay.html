<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>NexaPay · Paiement (démonstration)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2214%22%20fill%3D%22%230B6B4D%22/%3E%3Cpath%20d%3D%22M14.5%2034V15l18%2018.5V21.5%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%224.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2232.5%22%20cy%3D%2212.6%22%20r%3D%223.6%22%20fill%3D%22%237FE3B6%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Readex Pro";font-style:normal;font-display:swap;font-weight:160 700;
  src:url(https://cdn.jsdelivr.net/fontsource/fonts/readex-pro:vf@5.3.0/latin-wght-normal.woff2) format("woff2-variations"),url(https://cdn.jsdelivr.net/fontsource/fonts/readex-pro:vf@5.3.0/latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--paper:#F4F6F5;--surface:#FFFFFF;--ink:#14201B;--ink-2:#52605A;--ink-3:#7A8780;--line:#E1E7E4;--line-2:#ECF0EE;
  --brand:#0B6B4D;--brand-press:#085239;--brand-ink:#063826;--brand-tint:#E5F2EC;--mint:#7FE3B6;
  --ok:#0F7A4A;--ok-bg:#E3F3EA;--warn:#8A5A00;--warn-bg:#FFF1CF;--bad:#B42318;--bad-bg:#FDEBE9;--muted:#4F5965;--muted-bg:#ECEFF3;
  --font:"Readex Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.demo{background:var(--warn-bg);color:#5E3D00;font-size:12.5px;line-height:1.4;text-align:center;padding:7px 14px}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.secure{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);margin-left:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:8px}
.lang button{border:0;background:none;font-size:12.5px;font-weight:600;padding:5px 9px;color:var(--ink-2);min-height:32px}
.lang button[aria-pressed="true"]{background:var(--brand-tint);color:var(--brand-ink)}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--surface);border-radius:20px;padding:18px;margin-top:12px;border:1px solid var(--line-2)}
.merchant{display:flex;align-items:center;gap:12px}
.mav{width:44px;height:44px;border-radius:14px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;flex:none}
.merchant b{display:block;font-size:16px}
.merchant span{font-size:13px;color:var(--ink-2)}
.lines{margin:16px 0 0;border-top:1px solid var(--line-2);padding-top:12px;display:grid;gap:8px;font-size:14px}
.line{display:flex;justify-content:space-between;gap:12px}
.line dt{color:var(--ink-2)}.line dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.line.item dt{color:var(--ink);font-weight:500}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2);margin-top:12px;padding-top:12px}
.total span{color:var(--ink-2);font-size:14px}
.total b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.timer{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#5E3D00;background:var(--warn-bg);border-radius:12px;padding:8px 12px}
.timer.calm{background:var(--line-2);color:var(--ink-2)}
h2{font-size:16px;font-weight:600;margin:0 0 4px}
.field{margin-top:14px}
label,.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.req{color:var(--bad)}
.input{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.input::placeholder{color:var(--ink-3)}
.locked{position:relative}
.locked .input{background:#F2F4F3;color:#45524C;padding-right:40px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.locked svg{position:absolute;right:14px;bottom:17px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.err{font-size:13px;color:var(--bad);margin-top:6px}
.err:empty{display:none}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;font-size:13.5px;font-weight:400;line-height:1.45;color:var(--ink-2);cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--brand);flex:none}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:16px;border:0;background:var(--brand);color:#fff;font-weight:600;font-size:16px}
.btn:active{background:var(--brand-press)}
.btn[disabled]{opacity:.7;cursor:progress}
.btn.ghost{background:transparent;color:var(--ink-2);font-weight:500;min-height:46px;font-size:15px}
.btn.danger{background:var(--bad)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.actions{margin-top:16px;display:grid;gap:6px}
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--ink-2)}
.foot .mk{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
details.demo-opts{margin-top:12px;font-size:13px}
details.demo-opts summary{cursor:pointer;color:var(--ink-2);list-style:none;display:inline-flex;gap:6px;align-items:center}
details.demo-opts summary::-webkit-details-marker{display:none}
details.demo-opts .btn{margin-top:10px;min-height:44px;font-size:14px}
.result{text-align:center;padding:26px 18px}
.badge{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.muted{background:var(--muted-bg);color:var(--muted)}
.result h1{font-size:24px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.result p{color:var(--ink-2);margin:0 auto;max-width:34ch}
.result .lines{text-align:left;margin-top:20px}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.overlay{position:fixed;inset:0;background:rgba(20,32,27,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.reasons{display:grid;gap:8px;margin-top:12px}
.reason{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;cursor:pointer;font-size:15px;font-weight:400;color:var(--ink);margin:0}
.reason input{width:20px;height:20px;margin:0;accent-color:var(--brand)}
.reason:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.skel{height:220px;border-radius:20px;background:linear-gradient(90deg,#EEF1EF,#F7F9F8,#EEF1EF);background-size:200% 100%;animation:sh 1.2s linear infinite;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw path{stroke-dashoffset:0}}

.nobr{white-space:nowrap}

</style>
</head>
<body>

<main id="main"><div class="skel" aria-hidden="true"></div><div class="skel" aria-hidden="true" style="height:300px"></div></main>

const T = (k, v) => esc(t(k, v));

  <div class="actions"><button class="btn" id="b-pay" type="button">${T('pay', { amount: money(r.amount) })}</button>
    <button class="btn ghost" id="b-cancel" type="button">${T('cancel')}</button></div>
  <div class="foot"><span class="mk">${LOGO(18)}NexaPay</span><div>${T('foot')}</div>
    <details class="demo-opts"><summary>${ic(I.chev, 14, 2)}${T('demoOpts')}</summary><button class="btn sec" id="b-decline" type="button">${T('decline')}</button></details></div>`;
  $('#f-name').addEventListener('input', e => { form.name = e.target.value; $('#c-holder').value = form.name.toUpperCase(); $('#e-name').textContent = ''; });
  $('#f-phone').addEventListener('input', e => { form.phone = e.target.value; $('#e-phone').textContent = ''; });
  $('#f-consent').addEventListener('change', e => { form.consent = e.target.checked; $('#e-consent').textContent = ''; });
  $('#b-pay').addEventListener('click', () => submit('pay'));
  $('#b-decline').addEventListener('click', () => submit('decline'));
  $('#b-cancel').addEventListener('click', openCancel);
  tick();
}
function validate() {
  let ok = true;
  if (form.name.trim().length < 2) { $('#e-name').textContent = t('err.name'); ok = false; }
  if (form.phone.trim() && !normPhone(form.phone)) { $('#e-phone').textContent = t('err.phone'); ok = false; }
  else if (form.phone.trim() && !form.consent) { $('#e-consent').textContent = t('err.consent'); ok = false; }
  if (!ok) { const first = document.querySelector('.err:not(:empty)'); if (first) first.parentElement.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return ok;
}
async function submit(action, reason) {
  if (busy) return;
  if (!validate()) return;
  busy = true;
  const b = $('#b-pay');
  if (b) { b.disabled = true; b.innerHTML = `<span class="spinner"></span>${T('processing')}`; }
  if (action !== 'cancel') await new Promise(res => setTimeout(res, 1400));
  const { data, error } = await sb.rpc('submit_payment', {
    p_code: code, p_action: action, p_name: form.name.trim(), p_phone: form.phone.trim() || null, p_consent: form.consent, p_reason: reason || null,
  });
  busy = false;
  if (error || !data) {
    if (b) { b.disabled = false; b.textContent = t('pay', { amount: money(R.amount) }); }
    $('#e-global').textContent = t('err.net');
    return;
  }
  if (!data.ok) {
    if (data.error === 'name_required') { if (b) { b.disabled = false; b.textContent = t('pay', { amount: money(R.amount) }); } $('#e-name').textContent = t('err.name'); return; }
    if (data.error === 'phone_invalid') { if (b) { b.disabled = false; b.textContent = t('pay', { amount: money(R.amount) }); } $('#e-phone').textContent = t('err.phone'); return; }
    if (data.error === 'consent_required') { if (b) { b.disabled = false; b.textContent = t('pay', { amount: money(R.amount) }); } $('#e-consent').textContent = t('err.consent'); return; }
  }
  load(false);
}
function openCancel() {
  if (form.name.trim().length < 2 || (form.phone.trim() && (!normPhone(form.phone) || !form.consent))) { validate(); return; }
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="c-t"><h2 id="c-t" style="font-size:19px">${T('cancelTitle')}</h2>
    <p class="hint" style="margin-top:2px">${T('cancelSub', { shop: R.merchant_name })}</p>
    <div class="reasons" role="radiogroup">${['price', 'delivery', 'not_as_described', 'found_elsewhere', 'changed_mind', 'other'].map(k =>
      `<label class="reason"><input type="radio" name="reason" value="${k}">${T('reason.' + k)}</label>`).join('')}</div>
    <div class="err" id="e-reason" role="alert"></div>
    <div class="actions"><button class="btn danger" id="c-yes" type="button">${T('cancelConfirm')}</button><button class="btn ghost" id="c-no" type="button">${T('back')}</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('#c-no').addEventListener('click', close);
  ov.querySelector('#c-yes').addEventListener('click', () => {
    const r = ov.querySelector('input[name="reason"]:checked');
    if (!r) { ov.querySelector('#e-reason').textContent = t('err.reason'); return; }
    close();
    submit('cancel', r.value);
  });
  setTimeout(() => { const f = ov.querySelector('input'); if (f) f.focus(); }, 30);
}
function result(r) {
  clearInterval(timer);
  const shop = r ? r.merchant_name : '';
  const key = !r ? 'notfound' : r.status;
  const look = { paid: ['ok', I.check], failed: ['bad', I.x], canceled: ['muted', I.ban], expired: ['muted', I.hourglass], notfound: ['muted', I.search] }[key];
  const rows = r ? [[t('merchant'), shop], [t('item'), r.product_name + (r.quantity > 1 ? ' × ' + r.quantity : '')], [t('ref'), r.ref_no], [t('amount'), money(r.amount)],
    r.resolved_at ? [t('date'), when(r.resolved_at)] : null, r.status === 'paid' && r.customer_name ? [t('paidBy'), r.customer_name] : null].filter(Boolean) : [];
  $('#main').innerHTML = `<section class="card result"><div class="badge ${look[0]}${key === 'paid' ? ' draw' : ''}">${ic(look[1], 32, 2.2)}</div>
    <h1>${T('r.' + key + '.t')}</h1><p>${T('r.' + key + '.p', { shop })}</p>
    ${rows.length ? `<dl class="lines">${rows.map(([k, v]) => `<div class="line"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}</section>
    <div class="foot"><span class="mk">${LOGO(18)}NexaPay</span><div>${T('foot')}</div></div>`;
}
function tick() {
  clearInterval(timer);
  if (!R || R.status !== 'pending' || !R.expires_at) return;
  const end = Date.parse(R.expires_at);
  const paint = () => {
    const left = end - (Date.now() + offset), el = $('#cd');
    if (left <= 0) { clearInterval(timer); load(true); return; }
    const s = Math.floor(left / 1000), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const txt = d > 0 ? d + (LANG === 'en' ? ' d ' : ' j ') + h + ' h' : h > 0 ? h + ' h ' + String(m).padStart(2, '0') + ' min' : m + ':' + String(sec).padStart(2, '0');
    if (el) el.textContent = t('expiresIn', { t: txt });
    const box = $('#timer');
    if (box) box.classList.toggle('calm', left > 15 * 60000);
  };
  paint();
  timer = setInterval(paint, 1000);
}
function draw() { chrome(); if (!R || R.status !== 'pending') result(R); else checkout(R); }
async function load(track) {
  if (!/^[0-9a-f]{32}$/.test(code)) { R = null; draw(); return; }
  const { data, error } = await sb.rpc('get_order', { p_code: code, p_track: track });
  if (error) { $('#main').innerHTML = `<section class="card result"><div class="badge muted">${ic(I.info, 32, 2.2)}</div><p>${T('err.net')}</p></section>`; return; }
  R = data || null;
  if (R && R.server_now) offset = Date.parse(R.server_now) - Date.now();
  draw();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  LANG = b.getAttribute('data-lang'); store.set('nx_pay_lang', LANG);
  if (R && R.status === 'pending') { const n = $('#f-name'); if (n) form.name = n.value; }
  draw();
}));
if (!sb) { chrome(); $('#main').innerHTML = `<section class="card result"><p>${T('err.net')}</p></section>`; } else { chrome(); load(true); }

})();
</script>
</body>
</html>
